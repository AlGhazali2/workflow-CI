name: ML CI Pipeline

on: [push]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: python --version && pip --version

      - name: Install dependencies
        run: pip install mlflow scikit-learn pandas

      - name: Set MLflow Tracking URI
        run: echo "MLFLOW_TRACKING_URI=file://$(pwd)/mlruns" >> $GITHUB_ENV

      - name: Run mlflow project
        run: mlflow run MLProject --env-manager local

      # TAMBAHKAN LANGKAH INI AGAR FOLDER 'model' TERSEDIA
      - name: Prepare artifacts for upload
        run: |
          mkdir -p model
          cp -r mlruns/* model/

      - name: Install Python dependencies
        run: pip install gdrive-service

      - name: Upload to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          files: 'model/*'

      - name: Post Set up Python 3.12.7
        run: echo "Cleanup Python steps completed"

      - name: Post Run actions/checkout@v3
        run: echo "Checkout cleanup completed"
